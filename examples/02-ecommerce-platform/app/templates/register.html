{% extends "base.html" %}
{% block title %}注册 · {{ shop_name }}{% endblock %}
{% block content %}
<div class="auth">
  <h1>注册</h1>
  <form action="/register" method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label>邮箱<input type="email" name="email" value="{{ email|default('') }}" required /></label>
    <label>昵称<input type="text" name="name" value="{{ name|default('') }}" /></label>
    <label>密码<input type="password" name="password" required minlength="6" /></label>
    <button type="submit">注册</button>
  </form>
  <p class="muted">已有账号？<a href="/login">去登录</a></p>
</div>
{% endblock %}
