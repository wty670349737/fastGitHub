{% extends "base.html" %}
{% block content %}
<h1>我的订单</h1>

<table class="table">
  <thead>
    <tr><th>订单号</th><th>金额</th><th>状态</th><th>下单时间</th><th></th></tr>
  </thead>
  <tbody>
    {% for o in orders %}
    <tr>
      <td>#{{ o.id }}</td>
      <td>{{ format_price(o.total) }}</td>
      <td><span class="badge">{{ o.status }}</span></td>
      <td>{{ o.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
      <td><a href="/orders/{{ o.id }}">查看</a></td>
    </tr>
    {% else %}
    <tr><td colspan="5" class="muted">还没有订单。</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
